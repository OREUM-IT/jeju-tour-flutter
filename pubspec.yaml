name: jeju_tour_flutter
description: 오름잇 — 한라산과 올레 여행을 계획하는 Flutter 앱
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.9.0
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  geolocator: ^14.1.2
  image_picker: ^1.2.4
  image: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
